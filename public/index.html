    <!-- Linera X Dynamic -->
    <script>
        (() => {
            const matchesAuthHost = (url) => {
                try {
                    const u = new URL(url, document.baseURI);
                    return u.hostname === "relay.dynamicauth.com" || /\.dynamicauth\.com$/.test(u.hostname);
                } catch {
                    return false;
                }
            };

            const markCredentialless = (iframe) => {
                try {
                    iframe.credentialless = true;
                } catch { }
            };

            // Intercept direct assignments to iframe.src
            try {
                const desc = Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype, "src");
                if (desc && desc.set) {
                    const originalSet = desc.set;
                    Object.defineProperty(HTMLIFrameElement.prototype, "src", {
                        configurable: true,
                        enumerable: desc.enumerable,
                        get: desc.get,
                        set(value) {
                            if (matchesAuthHost(value)) markCredentialless(this);
                            return originalSet.call(this, value);
                        },
                    });
                }
            } catch { }

            // Intercept setAttribute('src', ...)
            try {
                const originalSetAttribute = Element.prototype.setAttribute;
                Element.prototype.setAttribute = function (name, value) {
                    if (
                        this instanceof HTMLIFrameElement &&
                        name &&
                        name.toLowerCase() === "src" &&
                        matchesAuthHost(value)
                    ) {
                        markCredentialless(this);
                    }
                    return originalSetAttribute.call(this, name, value);
                };
            } catch { }

            // Fallback: observe added iframes and src attribute changes
            try {
                const checkAndMark = (iframe) => {
                    const value = iframe.getAttribute("src") || iframe.src;
                    if (value && matchesAuthHost(value)) markCredentialless(iframe);
                };
                const observer = new MutationObserver((mutations) => {
                    for (const m of mutations) {
                        if (m.type === "childList") {
                            for (const node of m.addedNodes) {
                                if (node instanceof HTMLIFrameElement) {
                                    checkAndMark(node);
                                } else if (node && node.querySelectorAll) {
                                    node.querySelectorAll("iframe").forEach(checkAndMark);
                                }
                            }
                        } else if (
                            m.type === "attributes" &&
                            m.target instanceof HTMLIFrameElement &&
                            m.attributeName === "src"
                        ) {
                            checkAndMark(m.target);
                        }
                    }
                });
                observer.observe(document.documentElement, {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: ["src"],
                });
            } catch { }
        })();
    </script>

    <title>MazeRunner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation; /* Prevents zoom on double-tap */
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #000000;
            color: #FFFFFF;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        #game-container {
            /* position: relative; */
            width: 100vw;
            height: 100vh;
        }

        /* Mobile-specific styles */
        @media (max-width: 768px) {
            #game-container {
                padding-top: 0px; /* Remove padding to maximize maze space */
            }
            
            #ui-overlay {
                width: 90% !important;
                font-size: 14px !important;
                top: 8px !important;
                flex-wrap: wrap;
                gap: 8px !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                margin-bottom: 32px;
            }
            
            .ui-element {
                padding: 8px 14px !important;
                min-width: 70px !important;
                font-size: 12px !important;
            }

            .game-over-title {
                font-size: 36px;
                letter-spacing: 1px;
            }

            .final-score {
                font-size: 18px;
            }

            #submission-status {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            #game-container {
                padding-top: 0px; /* Remove padding to maximize maze space */
            }
            
            #ui-overlay {
                width: 95% !important;
                font-size: 12px !important;
                top: 6px !important;
                gap: 6px !important;
                left: 50% !important;
                transform: translateX(-50%) !important;
                margin-bottom: 16px;
            }
            
            .ui-element {
                padding: 6px 10px !important;
                min-width: 60px !important;
                font-size: 11px !important;
                /* background: rgba(139, 92, 246, 0.35) !important; */
            }

            .game-over-title {
                font-size: 28px;
                margin-bottom: 15px;
            }

            .final-score {
                font-size: 16px;
                margin-bottom: 20px;
            }

            #submission-status {
                font-size: 12px;
                min-height: 50px;
            }
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            /* background: rgba(0, 0, 0, 0.8); */
            /* border: 2px solid rgba(212, 15, 2, 1); */
            border-radius: 8px;
            padding: 12px 20px;
            pointer-events: auto;
            margin-bottom: 60px;
        }

        .ui-element {
            padding: 10px 20px;
            background: black;
            border-radius: 5px;
            border: 1px solid rgb(212, 15, 2);
            color: #FFFFFF;
            /* box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); */
            text-align: center;
            min-width: 120px;
            font-weight: 600;
            pointer-events: auto;
        }

        .ui-element span {
            color: #FFFFFF;
            font-weight: 700;
        }

        #wallet-status {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }

        .wallet-button {
            padding: 10px 20px;
            background: linear-gradient(45deg, #00CCFF, #FFAA00);
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.5);
        }

        .wallet-button:hover {
            transform: scale(1.05);
        }

        .wallet-button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 500;
            backdrop-filter: blur(8px);
            gap: 30px;
        }

        #game-over-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(168, 85, 247, 0.08) 0%, transparent 50%);
            pointer-events: none;
            border-radius: 0;
        }

        #game-over-screen > * {
            position: relative;
            z-index: 1;
        }

        .game-over-title {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: #E0E0E0;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            /* text-shadow: 0 0 30px rgba(16, 185, 129, 0.5); */
            animation: titlePulse 2s ease-in-out infinite;
            margin-bottom: 10px;
        }

        #wallet-ui {
            display: none !important;
        }

        @keyframes titlePulse {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.6));
            }
        }

        .final-score {
            font-size: 28px;
            font-weight: 700;
            color: #E0E0E0;
            letter-spacing: 2px;
        }

        @keyframes scoreGlow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(139, 92, 246, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.5));
            }
        }

        #submission-status {
            font-size: 16px;
            color: #E0E0E0;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
            line-height: 1.6;
        }

        #submission-status strong {
            color: #10b981;
            font-weight: 700;
        }

        /* Tablet Responsive */
        @media (max-width: 1024px) {
            .game-over-title {
                font-size: 48px;
            }

            .final-score {
                font-size: 26px;
            }

            #submission-status {
                font-size: 15px;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #game-over-screen {
                gap: 20px;
            }

            .game-over-title {
                font-size: 40px;
                letter-spacing: 2px;
            }

            .final-score {
                font-size: 22px;
            }

            #submission-status {
                font-size: 14px;
                min-height: 60px;
                gap: 10px;
            }
        }

        /* Small Mobile */
        @media (max-width: 480px) {
            #game-over-screen {
                gap: 16px;
            }

            .game-over-title {
                font-size: 32px;
                letter-spacing: 1px;
            }

            .final-score {
                font-size: 20px;
            }

            #submission-status {
                font-size: 13px;
                min-height: 55px;
            }
        }

        /* Extra Small Mobile */
        @media (max-width: 360px) {
            .game-over-title {
                font-size: 28px;
            }

            .final-score {
                font-size: 18px;
            }
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        .desktop-controls {
            display: inline;
        }

        .mobile-controls {
            display: none;
        }

        @media (max-width: 768px) {
            .desktop-controls {
                display: none;
            }
            
            .mobile-controls {
                display: inline;
            }
            
            #instructions {
                font-size: 12px;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="wallet-ui"></div>
    <div id="game-container">
        <!-- UI Overlay - Hidden by default, only shown during GameScene -->
        <div id="ui-overlay" style="display: none;">
            <div style="flex: 1;"></div>
            <div style="display: flex; flex-direction: column; gap: 4px; align-items: center;">
                <h1 style="font-size: 18px; font-weight: 600; color: #FFFFFF; margin: 0;">MazeRunner</h1>
                <span id="wallet-address" style="font-size: 15px; color: #aaa; margin-top: 2px;"></span>
                <div style="font-size: 18px; font-weight: 600; color: #FFFFFF;">
                    <span id="timer">01:30</span>
                </div>
                <div style="display: flex; flex-direction: row; justify-content: space-between; width: 500px;">
                    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 14px;">
                        <img src="assets/images/player-icon.png" alt="YOU" style="width: 30px; margin-bottom: 2px;" />
                        <span style="font-size: 14px; color: #FFFFFF;">You</span>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 14px;">
                        <img src="assets/images/opponent-icon.png" alt="OPPONENT" style="width: 30px; margin-bottom: 2px;" />
                        <span style="font-size: 14px; color: #FFFFFF;">Opponent</span>
                    </div>
                </div>
            </div>

            <div style="flex: 1; display: flex; justify-content: flex-end;">
                <button id="pause-button" style="background: #FFFFFF; border: none; padding: 8px; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 40px; height: 40px; cursor: pointer;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="6" y="4" width="4" height="16" rx="1" fill="#000000"/>
                        <rect x="14" y="4" width="4" height="16" rx="1" fill="#000000"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen">
            <div class="game-over-title">Game Over!</div>
            <div class="final-score"><span id="final-score">0</span></div>
        </div>


    </div>

    <!-- Phaser.js -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    
    <!-- Config and API must load FIRST (no defer) to be available for scenes -->
    <script src="src/config.js"></script>
    <script src="src/ui/ErrorPopup.js"></script>

    <!-- Linera Integration -->
    <script type="module" src="src/linera/dynamic-signer.ts"></script>
    <script type="module" src="src/linera/linera-adapter.ts"></script>


    <!-- Utility scripts (with defer is fine) -->
    <script defer src="src/utils/mazeGenerator.js"></script>
    <script defer src="src/utils/collisions.js"></script>
    
    <!-- Scene scripts (with defer) -->
    <script defer src="src/scenes/BootScene.js"></script>
    <script defer src="src/scenes/TitleScene.js"></script>
    <script defer src="src/scenes/InstructionsScene.js"></script>
    <!-- <script defer src="src/scenes/ConnectWalletScene.js"></script> -->
    <script defer src="src/scenes/MazeCreationScene.js"></script>
    <script defer src="src/scenes/GameScene.js"></script>
    <script defer src="src/scenes/UIScene.js"></script>
    
    <!-- Main entry point (loads last) -->
    <script type="module" src="src/main.jsx"></script>
</body>
</html>
